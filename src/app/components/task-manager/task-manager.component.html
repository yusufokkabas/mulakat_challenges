<div class="container">
  <h2>Task Manager</h2>
  <div class="top-row">
    <div class="form-container">
      <form (ngSubmit)="addTask()">
        <mat-form-field>
          <mat-label>Type</mat-label>
          <mat-select [(ngModel)]="newTask.type" name="type" required>
            <mat-option *ngFor="let type of taskTypes" [value]="type">{{
              type
            }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Content</mat-label>
          <input
            matInput
            [(ngModel)]="newTask.content"
            name="content"
            required
          />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Assigned Person</mat-label>
          <mat-select
            [(ngModel)]="newTask.assignedPerson"
            name="assignedPerson"
            required
          >
            <mat-option *ngFor="let user of users" [value]="user">{{
              user
            }}</mat-option>
          </mat-select>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit">
          Add Task
        </button>
      </form>
    </div>
    <div class="chart-container">
      <canvas
        baseChart
        [data]="pieChartData"
        [type]="pieChartType"
        [options]="pieChartOptions"
      >
      </canvas>
    </div>
  </div>
  <h3>Tasks</h3>
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>Task No.</mat-header-cell>
      <mat-cell *matCellDef="let task">{{ task.id }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="type">
      <mat-header-cell *matHeaderCellDef>Type</mat-header-cell>
      <mat-cell *matCellDef="let task">{{ task.type }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="content">
      <mat-header-cell *matHeaderCellDef>Content</mat-header-cell>
      <mat-cell *matCellDef="let task">{{ task.content }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="assignedPerson">
      <mat-header-cell *matHeaderCellDef>Assigned Person</mat-header-cell>
      <mat-cell *matCellDef="let task">{{ task.assignedPerson }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
      <mat-cell *matCellDef="let task">{{ task.status }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let task">
        <button
          mat-button
          color="primary"
          (click)="approveTask(task)"
          [disabled]="task.status === 'Approved'"
        >
          Approve
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
  </table>
</div>
